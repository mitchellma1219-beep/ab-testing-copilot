# Used when the dashboard is started from the repository root:
#   streamlit run app/streamlit_app.py
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#f9f9f7"
secondaryBackgroundColor = "#efeee9"
textColor = "#0b0b0b"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[server]
maxUploadSize = 100
