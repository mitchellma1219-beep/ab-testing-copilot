[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ab-testing-copilot"
version = "0.1.0"
description = "Rigorous A/B experiment design, diagnostics, analysis, simulation and decision support."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "scipy>=1.11", "pandas>=2.1", "pydantic>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "statsmodels>=0.14"]

[project.scripts]
abcopilot = "ab_testing_copilot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ab_testing_copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: larger Monte Carlo runs"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["scipy.*", "pandas.*"]
ignore_missing_imports = true
